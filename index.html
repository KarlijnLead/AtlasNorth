<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Atlas of the North</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=Inter:wght@400;500;600&family=DM+Mono&display=swap">
<style>
:root{--red:#cc0503;--rose:#e8908e;--ink:#070707;--paper:#fff;--mute:#8d8584;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:24px 16px;
  background-image:radial-gradient(70% 55% at 75% 110%,rgba(204,5,3,.28),transparent 70%)}
.card{width:100%;max-width:400px;display:grid;gap:22px}
.mark{width:52px;height:52px;border-radius:50%;background:var(--red);display:grid;place-items:center}
.mark svg{width:20px;height:20px}
.mono{font-family:"DM Mono",ui-monospace,monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--rose)}
h1{margin:0;font-weight:600;font-size:2.4rem;letter-spacing:-.03em;line-height:1}
h1 em{font-family:Fraunces,Georgia,serif;font-weight:500;color:var(--rose)}
p{margin:0;color:#cfc6c5;line-height:1.55}
form{display:grid;gap:14px}
label{font-family:"DM Mono",ui-monospace,monospace;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
input[type=password]{width:100%;font:inherit;font-size:1.05rem;color:#fff;background:transparent;border:0;border-bottom:1px solid #4a4140;padding:10px 0;outline:0}
input[type=password]:focus{border-bottom-color:var(--rose)}
.row{display:flex;align-items:center;gap:8px;font-family:Inter,system-ui,sans-serif;font-size:.9rem;letter-spacing:0;text-transform:none;color:#cfc6c5}
.row input{accent-color:var(--red);width:16px;height:16px}
button{font:inherit;font-weight:600;font-size:.95rem;color:#fff;background:var(--red);border:0;border-radius:999px;padding:.9em 1.6em;cursor:pointer;justify-self:start;transition:background .2s}
button:hover{background:#fff;color:var(--ink)}
button:disabled{opacity:.6;cursor:default}
.msg{min-height:1.4em;font-size:.9rem;color:var(--rose)}
:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
</style>
</head>
<body>
<main class="card" id="gate" hidden>
  <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2.5 11.2 21 3.5l-4.6 17-5.2-6.1-5.6 3.2 1.6-5.6z" fill="#fff"/></svg></div>
  <span class="mono">For tour leaders</span>
  <h1>Atlas <em>of the</em> North</h1>
  <p>This knowledge bank is for our leaders only. Enter the team password to continue.</p>
  <form id="f" autocomplete="on">
    <input type="text" name="username" value="leaders" autocomplete="username" hidden>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <label class="row"><input id="rm" type="checkbox" checked> Remember me on this device</label>
    <button type="submit" id="go">Open the atlas</button>
    <p class="msg" id="msg" role="status"></p>
  </form>
</main>
<noscript><p style="color:#fff">Please turn on JavaScript to open the Atlas of the North.</p></noscript>

const KEY='atlas-north-key';
const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
async function derive(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b(DATA.s),iterations:DATA.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);}
async function open_(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(DATA.i)},key,b(DATA.c));return new TextDecoder().decode(pt);}
function show(html){document.open();document.write(html);document.close();}
function store(v){try{v?localStorage.setItem(KEY,v):localStorage.removeItem(KEY);}catch(e){}}
async function tryRemembered(){let raw='';try{raw=localStorage.getItem(KEY)||'';}catch(e){}
  if(!raw)return false;
  try{const key=await crypto.subtle.importKey('raw',b(raw),{name:'AES-GCM'},false,['decrypt']);show(await open_(key));return true;}
  catch(e){store('');return false;}}
(async()=>{
  if(await tryRemembered())return;
  const gate=document.getElementById('gate');gate.hidden=false;
  const f=document.getElementById('f'),msg=document.getElementById('msg'),go=document.getElementById('go');
  document.getElementById('pw').focus();
  f.addEventListener('submit',async e=>{e.preventDefault();const pw=document.getElementById('pw').value;if(!pw)return;
    go.disabled=true;msg.textContent='Opening…';
    try{const key=await derive(pw);const html=await open_(key);
      if(document.getElementById('rm').checked)store(b64(await crypto.subtle.exportKey('raw',key)));
      show(html);}
    catch(err){go.disabled=false;msg.textContent='That password is not right. Please try again.';}
  });
})();
</script>
